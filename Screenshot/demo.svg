<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720">
<style>
  .f{font-family:'SFMono-Regular','Cascadia Code','Fira Code','Menlo','Courier New',Courier,monospace;font-size:13px}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes cmd {0%,3%{opacity:0}4%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes bl1 {0%,5%{opacity:0}6%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes bl2 {0%,7%{opacity:0}8%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes bl3 {0%,9%{opacity:0}10%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes bl4 {0%,11%{opacity:0}12%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes bl5 {0%,13%{opacity:0}14%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes aut {0%,16%{opacity:0}17%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes scn {0%,19%{opacity:0}20%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes phs {0%,22%{opacity:0}23%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes phh {0%,22%{opacity:0}23%,26%{opacity:1}27%,100%{opacity:0}}
  @keyframes phn {0%,22%{opacity:0}23%,36%{opacity:1}37%,100%{opacity:0}}
  @keyframes phc {0%,22%{opacity:0}23%,45%{opacity:1}46%,100%{opacity:0}}
  @keyframes phr {0%,22%{opacity:0}23%,57%{opacity:1}58%,100%{opacity:0}}
  @keyframes sth {0%,26%{opacity:0}27%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes stn {0%,36%{opacity:0}37%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes stc {0%,45%{opacity:0}46%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes str {0%,57%{opacity:0}58%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes res {0%,29%{opacity:0}30%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes s1  {0%,30%{opacity:0}31%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes s2  {0%,32%{opacity:0}33%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes s3  {0%,33%{opacity:0}34%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes s4  {0%,34%{opacity:0}35%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes s5  {0%,38%{opacity:0}39%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes s6  {0%,40%{opacity:0}41%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes s7  {0%,47%{opacity:0}48%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes s8  {0%,59%{opacity:0}60%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes fnd {0%,62%{opacity:0}63%,84%{opacity:1}91%,100%{opacity:0}}
  @keyframes cur {0%,2%{opacity:1}3%,84%{opacity:0}91%,100%{opacity:0}}
  .a-cmd{opacity:0;animation:cmd 13s infinite}
  .a-bl1{opacity:0;animation:bl1 13s infinite}
  .a-bl2{opacity:0;animation:bl2 13s infinite}
  .a-bl3{opacity:0;animation:bl3 13s infinite}
  .a-bl4{opacity:0;animation:bl4 13s infinite}
  .a-bl5{opacity:0;animation:bl5 13s infinite}
  .a-aut{opacity:0;animation:aut 13s infinite}
  .a-scn{opacity:0;animation:scn 13s infinite}
  .a-phs{opacity:0;animation:phs 13s infinite}
  .a-phh{opacity:0;animation:phh 13s infinite}
  .a-phn{opacity:0;animation:phn 13s infinite}
  .a-phc{opacity:0;animation:phc 13s infinite}
  .a-phr{opacity:0;animation:phr 13s infinite}
  .a-sth{opacity:0;animation:sth 13s infinite}
  .a-stn{opacity:0;animation:stn 13s infinite}
  .a-stc{opacity:0;animation:stc 13s infinite}
  .a-str{opacity:0;animation:str 13s infinite}
  .a-res{opacity:0;animation:res 13s infinite}
  .a-s1 {opacity:0;animation:s1  13s infinite}
  .a-s2 {opacity:0;animation:s2  13s infinite}
  .a-s3 {opacity:0;animation:s3  13s infinite}
  .a-s4 {opacity:0;animation:s4  13s infinite}
  .a-s5 {opacity:0;animation:s5  13s infinite}
  .a-s6 {opacity:0;animation:s6  13s infinite}
  .a-s7 {opacity:0;animation:s7  13s infinite}
  .a-s8 {opacity:0;animation:s8  13s infinite}
  .a-fnd{opacity:0;animation:fnd 13s infinite}
  .a-cur{opacity:0;animation:cur 13s infinite}
</style>

<!-- Window background -->
<rect width="720" height="500" rx="10" fill="#0d1117"/>

<!-- Title bar -->
<rect width="720" height="42" rx="10" fill="#161b22"/>
<rect y="32" width="720" height="10" fill="#161b22"/>

<!-- Traffic lights -->
<circle cx="24" cy="21" r="7" fill="#ff5f57"/>
<circle cx="46" cy="21" r="7" fill="#febc2e"/>
<circle cx="68" cy="21" r="7" fill="#28c840"/>

<!-- Title bar text -->
<text x="360" y="26" text-anchor="middle" fill="#6e7681" font-size="12" font-family="system-ui,-apple-system,sans-serif" font-weight="500">Go — crt.sh</text>

<!-- Prompt line -->
<text class="f a-cmd" x="16" y="68" xml:space="preserve">
  <tspan fill="#3fb950">❯</tspan><tspan fill="#e6edf3"> crt.sh -d </tspan><tspan fill="#58a6ff" font-weight="bold">hackerone.com</tspan>
</text>
<!-- Blinking cursor while "typing" -->
<rect class="a-cur" x="188" y="55" width="8" height="14" fill="#e6edf3" rx="1">
  <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.02;0.025;0.04" dur="13s" repeatCount="indefinite"/>
</rect>

<!-- Banner -->
<text class="f a-bl1" x="16" y="92"  fill="#39c5c8" font-weight="bold" xml:space="preserve">             __         __  </text>
<text class="f a-bl2" x="16" y="110" fill="#39c5c8" font-weight="bold" xml:space="preserve">  __________/ /_  _____/ /_ </text>
<text class="f a-bl3" x="16" y="128" fill="#39c5c8" font-weight="bold" xml:space="preserve"> / ___/ ___/ __/ / ___/ __ \</text>
<text class="f a-bl4" x="16" y="146" fill="#39c5c8" font-weight="bold" xml:space="preserve">/ /__/ /  / /__ (__  ) / / /</text>
<text class="f a-bl5" x="16" y="164" font-weight="bold" xml:space="preserve"><tspan fill="#39c5c8">\___/_/   \__(_)____/_/ /_/  </tspan><tspan fill="#e6edf3">v3.0.0</tspan></text>

<!-- Author -->
<text class="f a-aut" x="360" y="184" text-anchor="middle" fill="#484f58" xml:space="preserve">az7rb</text>

<!-- Divider line -->
<line class="a-scn" x1="16" y1="196" x2="704" y2="196" stroke="#21262d" stroke-width="1"/>

<!-- [*] Scanning -->
<text class="f a-scn" x="16" y="214" xml:space="preserve">
  <tspan fill="#388bfd">[*]</tspan><tspan fill="#8b949e"> Scanning </tspan><tspan fill="#e6edf3" font-weight="bold">hackerone.com</tspan>
</text>

<!-- Source rows — placeholders -->
<text class="f a-phr" x="16" y="234" fill="#484f58" xml:space="preserve">    ○  crt.sh       </text>
<text class="f a-phc" x="16" y="252" fill="#484f58" xml:space="preserve">    ○  certspotter  </text>
<text class="f a-phn" x="16" y="270" fill="#484f58" xml:space="preserve">    ○  crt.name     </text>
<text class="f a-phh" x="16" y="288" fill="#484f58" xml:space="preserve">    ○  shodan-ctl   </text>

<!-- Source rows — results (overlay) -->
<text class="f a-str" x="16" y="234" xml:space="preserve"><tspan fill="#3fb950">    ✔  </tspan><tspan fill="#e6edf3">crt.sh       </tspan><tspan fill="#484f58">→ </tspan><tspan fill="#e6edf3" font-weight="bold">15</tspan><tspan fill="#484f58"> found </tspan><tspan fill="#6e7681">[7412ms]</tspan></text>
<text class="f a-stc" x="16" y="252" xml:space="preserve"><tspan fill="#3fb950">    ✔  </tspan><tspan fill="#e6edf3">certspotter  </tspan><tspan fill="#484f58">→ </tspan><tspan fill="#e6edf3" font-weight="bold"> 9</tspan><tspan fill="#484f58"> found </tspan><tspan fill="#6e7681"> [688ms]</tspan></text>
<text class="f a-stn" x="16" y="270" xml:space="preserve"><tspan fill="#3fb950">    ✔  </tspan><tspan fill="#e6edf3">crt.name     </tspan><tspan fill="#484f58">→ </tspan><tspan fill="#e6edf3" font-weight="bold">31</tspan><tspan fill="#484f58"> found </tspan><tspan fill="#6e7681"> [471ms]</tspan></text>
<text class="f a-sth" x="16" y="288" xml:space="preserve"><tspan fill="#3fb950">    ✔  </tspan><tspan fill="#e6edf3">shodan-ctl   </tspan><tspan fill="#484f58">→ </tspan><tspan fill="#e6edf3" font-weight="bold"> 9</tspan><tspan fill="#484f58"> found </tspan><tspan fill="#6e7681"> [263ms]</tspan></text>

<!-- [+] Results -->
<text class="f a-res" x="16" y="312" xml:space="preserve" font-weight="bold"><tspan fill="#3fb950">[+]</tspan><tspan fill="#e6edf3"> Results</tspan></text>

<!-- Subdomains — two columns -->
<text class="f a-s1" x="30" y="332" fill="#c9d1d9">api.hackerone.com</text>
<text class="f a-s2" x="30" y="350" fill="#c9d1d9">docs.hackerone.com</text>
<text class="f a-s3" x="30" y="368" fill="#c9d1d9">support.hackerone.com</text>
<text class="f a-s4" x="30" y="386" fill="#c9d1d9">www.hackerone.com</text>
<text class="f a-s5" x="30" y="404" fill="#c9d1d9">3d.hackerone.com</text>
<text class="f a-s6" x="30" y="422" fill="#c9d1d9">resources.hackerone.com</text>
<text class="f a-s7" x="30" y="440" fill="#c9d1d9">gslink.hackerone.com</text>
<text class="f a-s8" x="30" y="458" fill="#c9d1d9">websockets.hackerone.com</text>

<!-- [+] Found -->
<text class="f a-fnd" x="16" y="482" xml:space="preserve" font-weight="bold">
  <tspan fill="#3fb950">[+]</tspan><tspan fill="#e6edf3"> Found </tspan><tspan fill="#58a6ff" font-weight="bold">33</tspan><tspan fill="#e6edf3"> unique subdomains for </tspan><tspan fill="#39c5c8">hackerone.com</tspan><tspan fill="#6e7681"> [7.5s]</tspan>
</text>
</svg>
