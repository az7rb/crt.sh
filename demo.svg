<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 475" width="700">
<style>
  .f { font-family: 'SFMono-Regular','Cascadia Code','Fira Code','Courier New',Courier,monospace; font-size: 13px; }
  @keyframes bl1  { 0%,2%  {opacity:0} 3%,79%  {opacity:1} 85%,100%{opacity:0} }
  @keyframes bl2  { 0%,5%  {opacity:0} 6%,79%  {opacity:1} 85%,100%{opacity:0} }
  @keyframes bl3  { 0%,8%  {opacity:0} 9%,79%  {opacity:1} 85%,100%{opacity:0} }
