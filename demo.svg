  .a-scan {opacity:0;animation:scan 12s infinite}
  .a-ph-sh{opacity:0;animation:ph-sh 12s infinite}
  .a-ph-cn{opacity:0;animation:ph-cn 12s infinite}
  .a-ph-cs{opacity:0;animation:ph-cs 12s infinite}
  .a-ph-cr{opacity:0;animation:ph-cr 12s infinite}
  .a-st-sh{opacity:0;animation:st-sh 12s infinite}
  .a-st-cn{opacity:0;animation:st-cn 12s infinite}
  .a-st-cs{opacity:0;animation:st-cs 12s infinite}
